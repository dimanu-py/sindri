[dependency-groups]
dev = [
    {include-group = "lint"},
    {include-group = "test"},
    {include-group = "release"},
    {include-group = "docs"},
    "object-mother-sindri",
    "value-object-sindri",
]

release = [
    "python-semantic-release",
]
lint = [
    "mypy",
    "ruff",
    "pip-audit",
    "pre-commit",
]
test = [
    "expects>=0.9.0",
    "pytest",
    "pytest-asyncio",
    "pytest-sugar>=1.1.1",
]
docs = [
    "mkdocs>=1.6.1",
    "mkdocs-literate-nav>=0.6.2",
    "mkdocs-macros-plugin>=1.4.0",
    "mkdocs-material>=9.6.21",
    "mkdocs-section-index>=0.3.10",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "B", "C4", "UP", "I"]
ignore = ["B008", "E501"]

[tool.ruff.lint.isort]
known-first-party = ["value_objects", "object_mother", "test"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

[tool.pytest.ini_options]
markers = [
    "unit: mark a test as a unit test",
    "acceptance: mark a test as an acceptance test",
    "integration: mark a test as an integration test",
]
testpaths = ["packages/value-objects/test", "packages/object-mother/test"]
asyncio_default_fixture_loop_scope = "function"

[tool.uv.workspace]
members = [
    "packages/sindripy",
    "packages/value-objects",
    "packages/object-mother",
]

[tool.uv.sources]
value-object-sindri = { workspace = true, editable = true }
object-mother-sindri = { workspace = true, editable = true }
