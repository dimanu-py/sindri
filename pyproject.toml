[dependency-groups]
dev = [
    {include-group = "lint"},
    {include-group = "test"},
    {include-group = "release"},
    {include-group = "docs"},
    "object-mother",
    "value-objects",
]

release = [
    "python-semantic-release",
]
lint = [
    "mypy",
    "ruff",
    "pip-audit",
    "pre-commit",
]
test = [
    "expects>=0.9.0",
    "pytest",
    "pytest-asyncio",
    "pytest-sugar>=1.1.1",
]
docs = [
    "mkdocs>=1.6.1",
    "mkdocs-literate-nav>=0.6.2",
    "mkdocs-macros-plugin>=1.4.0",
    "mkdocs-material>=9.6.21",
    "mkdocs-section-index>=0.3.10",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "B", "C4", "UP", "I"]
ignore = ["B008", "E501"]

[tool.ruff.lint.isort]
known-first-party = ["value_objects", "object_mother", "test"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false





[tool.pytest.ini_options]
markers = [
    "unit: mark a test as a unit test",
    "acceptance: mark a test as an acceptance test",
    "integration: mark a test as an integration test",
]
testpaths = ["packages/value-objects/test", "packages/object-mother/test"]
asyncio_default_fixture_loop_scope = "function"

[tool.semantic_release]
commit_message = "bump: new version {version} created"
commit_parser = "conventional"
major_on_zero = true
allow_zero_version = true
no_git_verify = false

[tool.semantic_release.commit_parser_options]
minor_tags = ["feat"]
patch_tags = ["fix", "perf", "refactor", "test", "docs"]
allowed_tags = ["feat", "fix", "refactor", "perf", "build", "docs"]
default_bump_level = 0
parse_squash_commits = false
ignore_merge_commits = true

[tool.semantic_release.changelog]
changelog_file = "CHANGELOG.md"
exclude_commit_patterns = ['''^Merge pull request #''', '''^Merge branch ''']
mode = "update"
#template_dir = "docs/changelog"

[tool.semantic_release.changelog.default_templates]
changelog_file = "CHANGELOG"
output_format = "md"
mask_initial_release = false

[tool.uv.workspace]
members = [
    "packages/value-objects",
    "packages/object-mother",
]

[tool.uv.sources]
value-objects = { workspace = true, editable = true }
object-mother = { workspace = true, editable = true }
